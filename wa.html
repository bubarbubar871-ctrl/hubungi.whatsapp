<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi via WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #25D366, #128C7E);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            max-width: 380px;
            width: 100%;
        }
        .wa-icon {
            font-size: 72px;
            margin-bottom: 15px;
        }
        h2 {
            color: #111;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .nomor {
            color: #555;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn-wa {
            background: #25D366;
            color: white;
            padding: 15px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
        }
        .btn-wa:hover {
            background: #128C7E;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(18, 140, 126, 0.4);
        }
        .keterangan {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="wa-icon">💬</div>
        <h2>Hubungi Kami</h2>
        <p class="nomor">+62 831-8941-3506</p>
        <a href="https://wa.me/6283189413506" target="_blank" class="btn-wa">Buka WhatsApp</a>
        <p class="keterangan">Klik tombol di atas untuk langsung membuka percakapan WhatsApp<br>— ini menggunakan tautan resmi WhatsApp —</p>
    </div>
</body>
</html>
